name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: node scripts/build-xpi.js
      - name: Publish release with the built .xpi
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/aiconnect-*.xpi --title "AIConnect ${GITHUB_REF_NAME}" --notes "Automated build for ${GITHUB_REF_NAME}. See CHANGELOG.md."
